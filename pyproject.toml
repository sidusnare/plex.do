[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plexdo"
version = "1.0.14"
description = "A command-line interface for Plex Media Server: playlists, exports, watched-state sync, and library management."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "plex.do contributors" }]
keywords = ["plex", "plexapi", "cli", "playlist", "m3u", "media-server"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "PlexAPI>=4.15.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pylint>=3.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/example/plexdo"
Source = "https://github.com/example/plexdo"
Issues = "https://github.com/example/plexdo/issues"

[project.scripts]
"plex.do" = "plexdo.cli:main"
plexdo = "plexdo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plexdo = ["data/plex.do.bash", "data/_plex.do", "data/plex.do.fish", "data/plex.do.1"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
disable = ["line-too-long", "too-few-public-methods"]

[tool.pylint.design]
max-args = 8
